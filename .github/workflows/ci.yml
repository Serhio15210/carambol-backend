name: CI

# When to run: on every pull request to main and on every push to main.
# The push trigger verifies that main stays healthy after a merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The GITHUB_TOKEN issued to each run may only read the code. If a malicious step
# ever slips into the pipeline, it cannot modify the repository
# (principle of least privilege).
permissions:
  contents: read

# If a new commit is pushed to the same ref while a run is still in progress,
# the old run is cancelled: checking outdated code is pointless and wastes minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    # A hung job should not wait for the default limit (6 hours).
    timeout-minutes: 10
    steps:
      # The runner is an empty machine, so the repository must be fetched explicitly.
      - name: Checkout
        uses: actions/checkout@v7

      # Node 22 matches the Dockerfile. cache: npm keeps downloaded packages between
      # runs (the cache key is the hash of package-lock.json).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # npm ci installs exactly the versions from package-lock.json and fails on mismatch.
      - name: Install dependencies
        run: npm ci

      # lint:check is ESLint without --fix: CI must verify code, not silently rewrite it.
      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

  # Unit tests, then e2e tests against a real PostgreSQL that lives only for this run.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A service container: GitHub starts it next to the job and removes it afterwards.
    services:
      postgres:
        image: postgres:16-alpine # the same major version as docker-compose.yml
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carambol_test
        # The job's steps start only after pg_isready reports the database is accepting connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432 # the steps run on the runner itself, so they reach it at localhost:5432
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carambol_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # globalSetup applies our migrations to the empty database first, so this also proves
      # that the schema can be built from scratch.
      - name: E2E tests
        run: npm run test:e2e

  # Local hooks can be skipped with --no-verify, so the same rules are enforced here.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 downloads the full history; the default shallow clone
      # does not contain the base commit that commitlint needs for the range.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
